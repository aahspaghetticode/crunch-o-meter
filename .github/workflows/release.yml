name: Release

# Push a tag like v1.2.0 to build a signed APK and publish it as a GitHub Release.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   CRUNCH_KEYSTORE_BASE64    base64 of your release .jks  (base64 -w0 release.jks)
#   CRUNCH_KEYSTORE_PASSWORD
#   CRUNCH_KEY_ALIAS
#   CRUNCH_KEY_PASSWORD
# Without them the APK is debug-signed, which installs fine but can't upgrade
# over a properly signed build.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.CRUNCH_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "CRUNCH_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No CRUNCH_KEYSTORE_BASE64 secret; the APK will be debug-signed"
          fi

      - name: Build APK
        working-directory: android
        env:
          CRUNCH_KEYSTORE_PASSWORD: ${{ secrets.CRUNCH_KEYSTORE_PASSWORD }}
          CRUNCH_KEY_ALIAS: ${{ secrets.CRUNCH_KEY_ALIAS }}
          CRUNCH_KEY_PASSWORD: ${{ secrets.CRUNCH_KEY_PASSWORD }}
        run: >
          ./gradlew assembleRelease
          -Pcrunch.versionName="${GITHUB_REF_NAME#v}"
          -Pcrunch.versionCode="${GITHUB_RUN_NUMBER}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="crunch-o-meter-${GITHUB_REF_NAME}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" --title "Crunch-o-meter $GITHUB_REF_NAME" --generate-notes
